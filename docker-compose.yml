volumes:
  dispatcher-logs:

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "nameservice:10.89.0.10"
    - "dispatcher:10.89.0.11"

services:
  nameservice:
    build:
      context: .
      dockerfile: nameservice/Dockerfile
    environment:
      - NAMESERVICE_PORT=50052
      - GRPC_DNS_RESOLVER=native
    ports:
      - "50052:50052"
    networks:
      default:
        ipv4_address: 10.89.0.10
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 50052), timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    environment:
      - DISPATCHER_PORT=50051
      - NAMESERVICE_ADDR=nameservice:50052
      - TASK_TIMEOUT_SEC=60
      - MAX_RETRIES=3
      - GRPC_DNS_RESOLVER=native
    ports:
      - "50051:50051"
    volumes:
      - dispatcher-logs:/app/logs
    networks:
      default:
        ipv4_address: 10.89.0.11
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 50051), timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-sum:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - WORKER_TYPE=sum
      - WORKER_PORT=50053
      - NAMESERVICE_ADDRESS=nameservice
      - NAMESERVICE_PORT=50052
      - DISPATCHER_ADDRESS=dispatcher
      - DISPATCHER_PORT=50051
      - HEARTBEAT_INTERVAL_SEC=10
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
      dispatcher:
        condition: service_healthy

  worker-reverse:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - WORKER_TYPE=reverse
      - WORKER_PORT=50053
      - NAMESERVICE_ADDRESS=nameservice
      - NAMESERVICE_PORT=50052
      - DISPATCHER_ADDRESS=dispatcher
      - DISPATCHER_PORT=50051
      - HEARTBEAT_INTERVAL_SEC=10
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
      dispatcher:
        condition: service_healthy

  worker-hash:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - WORKER_TYPE=hash
      - WORKER_PORT=50053
      - NAMESERVICE_ADDRESS=nameservice
      - NAMESERVICE_PORT=50052
      - DISPATCHER_ADDRESS=dispatcher
      - DISPATCHER_PORT=50051
      - HEARTBEAT_INTERVAL_SEC=10
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
      dispatcher:
        condition: service_healthy

  worker-upper:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - WORKER_TYPE=upper
      - WORKER_PORT=50053
      - NAMESERVICE_ADDRESS=nameservice
      - NAMESERVICE_PORT=50052
      - DISPATCHER_ADDRESS=dispatcher
      - DISPATCHER_PORT=50051
      - HEARTBEAT_INTERVAL_SEC=10
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
      dispatcher:
        condition: service_healthy

  worker-wait:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - WORKER_TYPE=wait
      - WORKER_PORT=50053
      - NAMESERVICE_ADDRESS=nameservice
      - NAMESERVICE_PORT=50052
      - DISPATCHER_ADDRESS=dispatcher
      - DISPATCHER_PORT=50051
      - HEARTBEAT_INTERVAL_SEC=10
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      nameservice:
        condition: service_healthy
      dispatcher:
        condition: service_healthy

  monitoring:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    environment:
      - DISPATCHER_ADDR=dispatcher:50051
      - NAMESERVICE_ADDR=nameservice:50052
      - WATCH_INTERVAL_SEC=5
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      dispatcher:
        condition: service_healthy
      nameservice:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - DISPATCHER_HOST=dispatcher
      - DISPATCHER_PORT=50051
      - GRPC_DNS_RESOLVER=native
    <<: *extra-hosts
    depends_on:
      dispatcher:
        condition: service_healthy
    profiles:
      - tools
